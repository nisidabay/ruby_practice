# Allowed commit types for Conventional Commits
# Every commit message must follow the format: type[(scope)]!: short description
# Examples:
#   feat: add user authentication
#   fix(auth): correct login timeout
#   refactor!: remove deprecated payment endpoint

types:
  - feat      # A new feature or functionality that the user can perceive
              # Examples: feat: add dark mode toggle
              #           feat(api): implement pagination endpoint

  - fix       # A bug fix or correction (improves existing behavior)
              # Examples: fix: prevent crash on empty search
              #           fix(login): handle invalid credentials gracefully

  - docs      # Documentation-only changes
              # Examples: docs: update installation guide
              #           docs(readme): add contribution guidelines

  - style     # Changes that do not affect the meaning of the code (formatting, white-space, etc.)
              # Examples: style: format code with prettier
              #           style: fix indentation in utils.js

  - refactor  # A code change that neither fixes a bug nor adds a feature (improves internal structure)
              # Examples: refactor: extract payment logic to service
              #           refactor: rename variables for clarity

  - perf      # A code change that improves performance
              # Examples: perf: optimize image loading with lazy
              #           perf: reduce database queries in dashboard

  - test      # Adding missing tests or correcting existing tests
              # Examples: test: add unit tests for auth service
              #           test: increase coverage on utils module

  - build     # Changes that affect the build system or external dependencies
              # Examples: build: upgrade webpack to v5
              #           build: add docker multi-stage build

  - ci        # Changes to our CI configuration files and scripts
              # Examples: ci: add GitHub Actions workflow
              #           ci: fix cache invalidation in pipeline

  - chore     # Maintenance tasks, configuration or setup that do not modify production code
              # Examples: chore: update .gitignore
              #           chore: initial project setup          ← This is where the initial commit goes
              #           chore: add editorconfig file

  - revert    # Reverts a previous commit (usually auto-generated by git revert)
              # Examples: revert: "feat: add dark mode" due to accessibility issues
              # Note: git typically generates this message automatically
